<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gezin</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏠</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --border: #e2e4e8;
    --text: #1c1e21;
    --muted: #8a8f98;
    --accent: #3b82f6;
    --danger: #e5484d;
    --radius: 12px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 90px;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px;
    display: flex; align-items: center; justify-content: space-between;
  }
  header h1 { font-size: 18px; margin: 0; }
  header .versie { font-size: 12px; color: var(--muted); margin-left: 8px; font-weight: 400; }
  header .titel-wrap { display: flex; align-items: baseline; }
  nav {
    position: sticky; top: 53px; z-index: 9;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    display: flex;
    overflow-x: auto;
  }
  nav button {
    flex: 1; padding: 10px 6px; border: none; background: none;
    font-size: 14px; color: var(--muted); border-bottom: 2px solid transparent;
    cursor: pointer;
  }
  nav button.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

  main { padding: 12px; max-width: 640px; margin: 0 auto; }

  .add-bar {
    position: sticky; top: 94px; z-index: 8;
    background: var(--bg);
    padding: 8px 0 12px;
  }
  .add-form {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px;
  }
  .add-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .add-row:last-child { margin-bottom: 0; }
  .combo-wrap { position: relative; flex: 1; }
  input, select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 15px;
    background: #fff;
  }
  .suggestions {
    position: absolute; left: 0; right: 0; top: 100%;
    background: #fff; border: 1px solid var(--border); border-top: none;
    border-radius: 0 0 8px 8px; max-height: 180px; overflow-y: auto; z-index: 20;
  }
  .suggestions div { padding: 8px 12px; font-size: 14px; cursor: pointer; }
  .suggestions div:hover, .suggestions div.active { background: var(--bg); }
  .btn-add {
    background: var(--accent); color: #fff; border: none;
    border-radius: 8px; padding: 0 16px; font-size: 20px; font-weight: 600;
    cursor: pointer; min-width: 44px;
  }
  .detail-row { display: flex; gap: 8px; }

  .categorie-groep { margin-bottom: 18px; }
  .categorie-titel {
    font-size: 13px; font-weight: 700; text-transform: uppercase;
    color: var(--muted); letter-spacing: 0.04em; margin: 0 0 6px 4px;
  }
  ul.items { list-style: none; margin: 0; padding: 0; }
  li.item {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px; margin-bottom: 6px;
    display: flex; align-items: center; gap: 10px;
  }
  li.item.afgevinkt { opacity: 0.5; }
  .checkbox {
    width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--accent);
    flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: #fff;
  }
  li.item.afgevinkt .checkbox { background: var(--accent); }
  .item-main { flex: 1; min-width: 0; }
  .item-naam { font-size: 15px; }
  li.item.afgevinkt .item-naam { text-decoration: line-through; }
  .item-meta { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .badge-winkel {
    font-size: 11px; background: var(--bg); border: 1px solid var(--border);
    border-radius: 100px; padding: 2px 8px; color: var(--muted); white-space: nowrap;
  }
  .edit-btn {
    background: none; border: none; color: var(--muted); font-size: 16px;
    cursor: pointer; padding: 4px; flex-shrink: 0; line-height: 1;
  }
  .empty-state { text-align: center; color: var(--muted); padding: 40px 20px; font-size: 14px; }

  .maand-strip {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; margin-bottom: 12px;
  }
  .maand-nav-btn { background: none; border: none; font-size: 20px; color: var(--accent); cursor: pointer; padding: 4px 12px; }
  .maand-label { font-weight: 600; font-size: 15px; }

  .agenda-dag-groep { margin-bottom: 16px; }
  .agenda-dag-titel {
    font-size: 13px; font-weight: 700; color: var(--muted); margin: 0 0 6px 4px;
  }
  .agenda-item {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; margin-bottom: 6px; display: flex; align-items: center; gap: 10px;
  }
  .agenda-item .tijd { font-size: 13px; color: var(--muted); min-width: 42px; }
  .agenda-item .titel { flex: 1; font-size: 15px; }
  .agenda-item.verjaardag { background: #fff7e6; }
  .wie-badge {
    font-size: 11px; border-radius: 100px; padding: 2px 8px; white-space: nowrap; color: #fff;
  }
  .wie-Ik { background: #3b82f6; }
  .wie-Mijn-vrouw { background: #ec4899; }
  .wie-Samen { background: #10b981; }

  .vaste-artikelen-link {
    display: block; text-align: center; font-size: 13px; color: var(--accent);
    padding: 14px; cursor: pointer;
  }

  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 50;
    align-items: flex-end; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: #fff; width: 100%; max-width: 640px; max-height: 80vh;
    border-radius: 16px 16px 0 0; padding: 16px; overflow-y: auto;
  }
  .modal h2 { margin: 0 0 12px; font-size: 16px; }
  .modal-close { float: right; border: none; background: none; font-size: 20px; color: var(--muted); cursor: pointer; }
  .vast-item-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .vast-item-row .naam { flex: 1; font-size: 14px; }
  .vast-item-row .cat { font-size: 12px; color: var(--muted); }
  .vast-add-to-list-btn {
    background: var(--accent); color: #fff; border: none; border-radius: 6px;
    font-size: 12px; padding: 5px 10px; cursor: pointer; white-space: nowrap;
  }
  .vast-item-row button[data-action="delete"] { background: none; border: none; color: var(--danger); font-size: 18px; cursor: pointer; }
</style>
</head>
<body>

<header>
  <div class="titel-wrap">
    <h1>🏠 Gezin</h1>
    <span class="versie" id="versie-label"></span>

</header>
<nav>
  <button class="tab-btn active" data-tab="boodschappen">🛒 Boodschappen</button>
  <button class="tab-btn" data-tab="kalender">📅 Kalender</button>
  <button class="tab-btn" data-tab="taken" disabled title="Nog te bouwen">✅ Taken</button>
  <button class="tab-btn" data-tab="recepten" disabled title="Nog te bouwen">📖 Recepten</button>

<main>
  <section id="tab-content-boodschappen" class="tab-content">
    <div class="add-bar">
      <div class="add-form">
        <div class="add-row">
          <div class="combo-wrap">
            <input id="naam-input" type="text" placeholder="Wat heb je nodig?" autocomplete="off">
            <div id="suggestions" class="suggestions" style="display:none;"></div>
          </div>
          <button class="btn-add" id="add-btn" title="Toevoegen">+</button>

        <div class="add-row detail-row">
          <input id="detail-input" type="text" placeholder="Aantal/gewicht (optioneel)">
          <input id="winkel-input" type="text" placeholder="Winkel (optioneel)">
        </div>
        <div class="add-row">
          <select id="categorie-select"></select>

      </div>
    </div>

    <div id="lijst"></div>

    <div class="vaste-artikelen-link" id="open-vaste-artikelen">⚙️ Vaste artikelen beheren</div>
  </section>

  <section id="tab-content-kalender" class="tab-content" style="display:none;">
    <div class="maand-strip">
      <button id="maand-vorige" class="maand-nav-btn">‹</button>
      <span id="maand-label" class="maand-label"></span>
      <button id="maand-volgende" class="maand-nav-btn">›</button>

    <div class="add-bar">
      <div class="add-form">
        <div class="add-row">
          <input id="afspraak-titel-input" type="text" placeholder="Titel afspraak">

        <div class="add-row">

          <button class="btn-add" id="afspraak-add-btn" title="Toevoegen">+</button>

    <div id="agenda-lijst"></div>

    <div class="vaste-artikelen-link" id="open-verjaardag-modal">🎂 Verjaardag toevoegen</div>

</main>

<div class="modal-overlay" id="verjaardag-modal-overlay">
  <div class="modal">
    <button class="modal-close" id="close-verjaardag-modal">✕</button>

    <div class="add-row">
      <input id="verjaardag-dag-input" type="number" min="1" max="31" placeholder="Dag">
      <select id="verjaardag-maand-select"></select>
    </div>
    <button class="btn-add" id="verjaardag-add-btn" style="margin-top:4px; width:100%;">Toevoegen</button>
    <div id="verjaardagen-lijst" style="margin-top:12px;"></div>

</div>

<div class="modal-overlay" id="vaste-modal-overlay">

      <input id="vast-naam-input" type="text" placeholder="Naam (bijv. Melk)">

</div>

<div class="modal-overlay" id="edit-modal-overlay">
  <div class="modal">

    <div class="add-row">

      <select id="edit-categorie-select"></select>

<script>
// ---------------------------------------------------------------
// Config
// ---------------------------------------------------------------
const SUPABASE_URL = 'https://vlhjikyslkkekxtapzqj.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_bWtpObTiK7mmEiQYHZuvgA_upVn7e2I';
const APP_VERSIE = 'v0.3';

// Vaste, voorgedefinieerde categorieën — volgorde bepaalt sortering.
// Volgt de looproute door de supermarkt.
const CATEGORIEEN = [
  'Groente en fruit', 'Broodbeleg', 'Buitenlands', 'Diervoeding', 'Huishouden',
  'Conserven', 'Broodafdeling', 'Zuivel', 'Dranken', 'Chips en nootjes',
  'Snoep en koek', 'Diepvries', 'Overig',
];

// ---------------------------------------------------------------
// App module — pure logic, geen DOM/Supabase-afhankelijkheid waar mogelijk,
// zodat het los te testen is via jsdom + gemockte supabase-client.
// ---------------------------------------------------------------
const GezinBoodschappen = (function () {

  function sortItems(items) {
    // Groepeert op categorie (in vaste volgorde), binnen elke categorie:
    // onafgevinkt eerst (alfabetisch), dan afgevinkt (alfabetisch).
    const groups = {};
    for (const cat of CATEGORIEEN) groups[cat] = { open: [], afgevinkt: [] };

    for (const item of items) {
      const cat = CATEGORIEEN.includes(item.categorie) ? item.categorie : 'Overig';
      if (item.afgevinkt) groups[cat].afgevinkt.push(item);
      else groups[cat].open.push(item);
    }

    const byNaam = (a, b) => a.naam.localeCompare(b.naam, 'nl');
    const result = [];
    for (const cat of CATEGORIEEN) {
      const g = groups[cat];
      g.open.sort(byNaam);
      g.afgevinkt.sort(byNaam);
      if (g.open.length === 0 && g.afgevinkt.length === 0) continue;
      result.push({ categorie: cat, items: [...g.open, ...g.afgevinkt] });
    }
    return result;
  }

  function isExpiredIncidenteel(item, now) {
    // Incidentele items (geen vast_artikel_id) die >1 dag geleden zijn
    // afgevinkt mogen automatisch verdwijnen.
    if (item.vast_artikel_id) return false;
    if (!item.afgevinkt || !item.afgevinkt_op) return false;
    const afgevinktOp = new Date(item.afgevinkt_op).getTime();
    return (now - afgevinktOp) > 24 * 60 * 60 * 1000;
  }

  function filterSuggestions(vasteArtikelen, query) {
    const q = query.trim().toLowerCase();
    if (!q) return [];
    return vasteArtikelen
      .filter(v => v.naam.toLowerCase().includes(q))
      .sort((a, b) => a.naam.localeCompare(b.naam, 'nl'))
      .slice(0, 8);
  }

  // Vindt een al-op-de-lijst-staand, nog niet afgevinkt item met (nagenoeg)
  // dezelfde naam — gebruikt om dubbele invoer te signaleren vóór het
  // toevoegen, ongeacht of dat gebeurt via vrije tekst of vanuit de vaste lijst.
  function findActiveDuplicate(items, naam) {
    const q = (naam || '').trim().toLowerCase();
    if (!q) return null;
    return items.find(i => !i.afgevinkt && i.naam.trim().toLowerCase() === q) || null;
  }

  function buildInsertPayload({ naam, detail, categorie, winkel, vastArtikel }) {
    if (!naam || !naam.trim()) throw new Error('Naam is verplicht');
    if (!categorie || !CATEGORIEEN.includes(categorie)) throw new Error('Ongeldige categorie');
    return {
      naam: naam.trim(),
      detail: detail && detail.trim() ? detail.trim() : null,
      categorie,
      winkel: winkel && winkel.trim() ? winkel.trim() : null,
      vast_artikel_id: vastArtikel ? vastArtikel.id : null,
      afgevinkt: false,
      afgevinkt_op: null,
    };
  }

  // Bewerken raakt nooit vast_artikel_id/afgevinkt-status — alleen de
  // beschrijvende velden van deze ene rij, ongeacht of hij incidenteel of
  // vanuit de vaste-artikelenlijst is toegevoegd.
  function buildUpdatePayload({ naam, detail, categorie, winkel }) {
    if (!naam || !naam.trim()) throw new Error('Naam is verplicht');
    if (!categorie || !CATEGORIEEN.includes(categorie)) throw new Error('Ongeldige categorie');
    return {
      naam: naam.trim(),
      detail: detail && detail.trim() ? detail.trim() : null,
      categorie,
      winkel: winkel && winkel.trim() ? winkel.trim() : null,
    };
  }

  // Bepaalt wat er moet gebeuren als een item wordt afgevinkt/uitgevinkt.
  // Vast artikel + afvinken -> direct verwijderen (comeback via vaste lijst).
  // Incidenteel + afvinken  -> markeren + timestamp (opruimen na 1 dag).
  // Uitvinken (undo)        -> altijd terug naar onafgevinkt, timestamp weg.
  function toggleAction(item) {
    if (!item.afgevinkt) {
      // wordt afgevinkt
      if (item.vast_artikel_id) {
        return { type: 'delete', id: item.id };
      }
      return { type: 'update', id: item.id, changes: { afgevinkt: true, afgevinkt_op: new Date().toISOString() } };
    }
    // wordt uitgevinkt (alleen mogelijk voor incidentele items, want vaste zijn al weg)
    return { type: 'update', id: item.id, changes: { afgevinkt: false, afgevinkt_op: null } };
  }

  function cleanupExpired(items, now = Date.now()) {
    return items.filter(i => isExpiredIncidenteel(i, now)).map(i => i.id);
  }

  return { sortItems, isExpiredIncidenteel, filterSuggestions, findActiveDuplicate, buildInsertPayload, buildUpdatePayload, toggleAction, cleanupExpired, CATEGORIEEN };
})();

// ---------------------------------------------------------------
// GezinKalender — pure logica voor de Kalender-tab (kern-agenda +
// verjaardagen). Herhalende afspraken en de iCal-feed volgen in een
// latere ronde.
// ---------------------------------------------------------------
const GezinKalender = (function () {

  const WIE_OPTIES = ['Ik', 'Mijn vrouw', 'Samen'];
  const MAAND_NAMEN = [
    'januari', 'februari', 'maart', 'april', 'mei', 'juni',
    'juli', 'augustus', 'september', 'oktober', 'november', 'december',
  ];

  function toIsoDate(d) {
    // Lokale datum (geen UTC-verschuiving), consistent met de rest van de app.
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  function getMonthBounds(year, month) {
    // month is 0-indexed (zoals JS Date), voor consistentie met de rest.
    const first = new Date(year, month, 1);
    const last = new Date(year, month + 1, 0);
    return { first: toIsoDate(first), last: toIsoDate(last) };
  }

  function monthLabel(year, month) {
    return `${MAAND_NAMEN[month]} ${year}`;
  }

  // Bepaalt vanaf welke datum items getoond worden binnen de bekeken maand:
  // in de huidige maand tonen we alleen vandaag en later (geen verleden),
  // in elke andere maand (verleden of toekomst) de hele maand.
  function getViewStartDate(year, month, today) {
    const { first } = getMonthBounds(year, month);
    const isHuidigeMaand = today.getFullYear() === year && today.getMonth() === month;
    return isHuidigeMaand ? toIsoDate(today) : first;
  }

  // Berekent de verjaardagsdatum van dit specifieke jaar/maand-paar.
  // Geeft null als dag/maand niet binnen deze maand vallen.
  function getBirthdayOccurrencesInMonth(verjaardagen, year, month) {
    return verjaardagen
      .filter(v => (v.maand - 1) === month)
      .map(v => ({
        type: 'verjaardag',
        id: v.id,
        titel: `🎂 ${v.naam}`,
        datum: toIsoDate(new Date(year, month, v.dag)),
      }));
  }

  // Bouwt de volledige, per-dag-gegroepeerde agenda voor de bekeken maand,
  // gefilterd vanaf de view-startdatum. Volgorde binnen een dag:
  // verjaardagen (hele dag) -> afspraken zonder tijd -> afspraken met tijd (oplopend).
  function buildMonthAgenda(afspraken, verjaardagen, year, month, today) {
    const viewStart = getViewStartDate(year, month, today);
    const { last } = getMonthBounds(year, month);

    const afspraakItems = afspraken
      .filter(a => a.datum >= viewStart && a.datum <= last)
      .map(a => ({ type: 'afspraak', id: a.id, titel: a.titel, datum: a.datum, tijd: a.tijd || null, wie: a.wie }));

    const verjaardagItems = getBirthdayOccurrencesInMonth(verjaardagen, year, month)
      .filter(v => v.datum >= viewStart);

    const alleItems = [...afspraakItems, ...verjaardagItems];

    const perDag = {};
    for (const item of alleItems) {
      if (!perDag[item.datum]) perDag[item.datum] = [];
      perDag[item.datum].push(item);
    }

    const dagen = Object.keys(perDag).sort();
    return dagen.map(datum => {
      const items = perDag[datum];
      const verjaardag = items.filter(i => i.type === 'verjaardag');
      const zonderTijd = items.filter(i => i.type === 'afspraak' && !i.tijd);
      const metTijd = items.filter(i => i.type === 'afspraak' && i.tijd).sort((a, b) => a.tijd.localeCompare(b.tijd));
      return { datum, items: [...verjaardag, ...zonderTijd, ...metTijd] };
    });
  }

  function buildAfspraakInsertPayload({ titel, datum, tijd, wie }) {
    if (!titel || !titel.trim()) throw new Error('Titel is verplicht');
    if (!datum) throw new Error('Datum is verplicht');
    if (!WIE_OPTIES.includes(wie)) throw new Error('Ongeldige keuze bij "wie"');
    return {
      titel: titel.trim(),
      datum,
      tijd: tijd && tijd.trim() ? tijd.trim() : null,
      wie,
    };
  }

  function buildVerjaardagInsertPayload({ naam, dag, maand }) {
    if (!naam || !naam.trim()) throw new Error('Naam is verplicht');
    const dagNum = Number(dag);
    const maandNum = Number(maand);
    if (!Number.isInteger(dagNum) || dagNum < 1 || dagNum > 31) throw new Error('Ongeldige dag');
    if (!Number.isInteger(maandNum) || maandNum < 1 || maandNum > 12) throw new Error('Ongeldige maand');
    return { naam: naam.trim(), dag: dagNum, maand: maandNum };
  }

  return {
    WIE_OPTIES, MAAND_NAMEN, toIsoDate, getMonthBounds, monthLabel, getViewStartDate,
    getBirthdayOccurrencesInMonth, buildMonthAgenda, buildAfspraakInsertPayload, buildVerjaardagInsertPayload,
  };
})();

// Maak beschikbaar voor de jsdom-testrunner (Node) én de browser.
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { GezinBoodschappen, GezinKalender };
}

// ---------------------------------------------------------------
// DOM/Supabase wiring — draait alleen in de browser.
// ---------------------------------------------------------------
if (typeof window !== 'undefined' && typeof document !== 'undefined') {
  (function initApp() {
    const supabase = window.supabase && window.supabase.createClient
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
      : null;

    let items = [];
    let vasteArtikelen = [];
    let selectedVastArtikel = null;

    const naamInput = document.getElementById('naam-input');
    const suggestionsBox = document.getElementById('suggestions');
    const detailInput = document.getElementById('detail-input');
    const winkelInput = document.getElementById('winkel-input');
    const categorieSelect = document.getElementById('categorie-select');
    const addBtn = document.getElementById('add-btn');
    const lijstEl = document.getElementById('lijst');

    const versieLabel = document.getElementById('versie-label');
    if (versieLabel) versieLabel.textContent = APP_VERSIE;

    // --- Tab-switching ---
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        if (btn.disabled) return;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('.tab-content').forEach(sec => { sec.style.display = 'none'; });
        document.getElementById('tab-content-' + btn.getAttribute('data-tab')).style.display = '';
      });
    });

    function populateCategorieSelects() {
      for (const sel of [categorieSelect, document.getElementById('vast-categorie-select'), document.getElementById('edit-categorie-select')]) {
        sel.innerHTML = GezinBoodschappen.CATEGORIEEN.map(c => `<option value="${c}">${c}</option>`).join('');
      }
    }
    populateCategorieSelects();

    naamInput.addEventListener('input', () => {
      selectedVastArtikel = null;
      const matches = GezinBoodschappen.filterSuggestions(vasteArtikelen, naamInput.value);
      if (matches.length === 0) {
        suggestionsBox.style.display = 'none';
        return;
      }
      suggestionsBox.innerHTML = matches.map(m => `<div data-id="${m.id}">${m.naam}</div>`).join('');
      suggestionsBox.style.display = 'block';
    });

    suggestionsBox.addEventListener('click', (e) => {
      const id = e.target.getAttribute('data-id');
      if (!id) return;
      const v = vasteArtikelen.find(x => String(x.id) === String(id));
      if (!v) return;
      selectedVastArtikel = v;
      naamInput.value = v.naam;
      categorieSelect.value = v.categorie;
      suggestionsBox.style.display = 'none';
    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.combo-wrap')) suggestionsBox.style.display = 'none';
    });

    async function insertItem(payload) {
      const duplicate = GezinBoodschappen.findActiveDuplicate(items, payload.naam);
      if (duplicate) {
        const doorgaan = confirm(`"${payload.naam}" staat al op de lijst. Toch nogmaals toevoegen?`);
        if (!doorgaan) return false;
      }
      const { error } = await supabase.from('boodschappen_items').insert(payload);
      if (error) { alert('Kon niet toevoegen: ' + error.message); return false; }
      return true;
    }

    async function addItem() {
      let payload;
      try {
        payload = GezinBoodschappen.buildInsertPayload({
          naam: naamInput.value,
          detail: detailInput.value,
          categorie: categorieSelect.value,
          winkel: winkelInput.value,
          vastArtikel: selectedVastArtikel,
        });
      } catch (err) {
        alert(err.message);
        return;
      }
      const ok = await insertItem(payload);
      if (!ok) return;
      naamInput.value = '';
      detailInput.value = '';
      winkelInput.value = '';
      selectedVastArtikel = null;
      naamInput.focus();
    }
    addBtn.addEventListener('click', addItem);
    naamInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') addItem(); });

    async function toggleItem(item) {
      const action = GezinBoodschappen.toggleAction(item);
      if (action.type === 'delete') {
        await supabase.from('boodschappen_items').delete().eq('id', action.id);
      } else {
        await supabase.from('boodschappen_items').update(action.changes).eq('id', action.id);
      }
    }

    // --- Item bewerken ---
    const editModalOverlay = document.getElementById('edit-modal-overlay');
    const editNaamInput = document.getElementById('edit-naam-input');
    const editDetailInput = document.getElementById('edit-detail-input');
    const editWinkelInput = document.getElementById('edit-winkel-input');
    const editCategorieSelect = document.getElementById('edit-categorie-select');
    let editingItemId = null;

    function openEditModal(item) {
      editingItemId = item.id;
      editNaamInput.value = item.naam;
      editDetailInput.value = item.detail || '';
      editWinkelInput.value = item.winkel || '';
      editCategorieSelect.value = item.categorie;
      editModalOverlay.classList.add('open');
    }
    document.getElementById('close-edit-modal').addEventListener('click', () => {
      editModalOverlay.classList.remove('open');
      editingItemId = null;
    });
    document.getElementById('edit-save-btn').addEventListener('click', async () => {
      if (editingItemId == null) return;
      let changes;
      try {
        changes = GezinBoodschappen.buildUpdatePayload({
          naam: editNaamInput.value,
          detail: editDetailInput.value,
          categorie: editCategorieSelect.value,
          winkel: editWinkelInput.value,
        });
      } catch (err) {
        alert(err.message);
        return;
      }
      const { error } = await supabase.from('boodschappen_items').update(changes).eq('id', editingItemId);
      if (error) { alert('Kon niet opslaan: ' + error.message); return; }
      editModalOverlay.classList.remove('open');
      editingItemId = null;
    });

    async function cleanupExpiredItems() {
      const idsToDelete = GezinBoodschappen.cleanupExpired(items);
      if (idsToDelete.length === 0) return;
      await supabase.from('boodschappen_items').delete().in('id', idsToDelete);
    }

    function render() {
      const groups = GezinBoodschappen.sortItems(items);
      if (groups.length === 0) {
        lijstEl.innerHTML = '<div class="empty-state">Boodschappenlijst is leeg 🎉</div>';
        return;
      }
      lijstEl.innerHTML = groups.map(g => `
        <div class="categorie-groep">
          <div class="categorie-titel">${g.categorie}</div>
          <ul class="items">
            ${g.items.map(item => `
              <li class="item ${item.afgevinkt ? 'afgevinkt' : ''}" data-id="${item.id}">
                <div class="checkbox" data-role="toggle">${item.afgevinkt ? '✓' : ''}</div>
                <div class="item-main" data-role="toggle">
                  <div class="item-naam">${escapeHtml(item.naam)}${item.detail ? ' — ' + escapeHtml(item.detail) : ''}</div>
                </div>
                ${item.winkel ? `<span class="badge-winkel">${escapeHtml(item.winkel)}</span>` : ''}
                <button class="edit-btn" data-role="edit" title="Bewerken">✏️</button>
              </li>
            `).join('')}
          </ul>
        </div>
      `).join('');

      lijstEl.querySelectorAll('.item').forEach(el => {
        const id = el.getAttribute('data-id');
        el.querySelectorAll('[data-role="toggle"]').forEach(part => {
          part.addEventListener('click', () => {
            const item = items.find(i => String(i.id) === String(id));
            if (item) toggleItem(item);
          });
        });
        el.querySelector('[data-role="edit"]').addEventListener('click', () => {
          const item = items.find(i => String(i.id) === String(id));
          if (item) openEditModal(item);
        });
      });
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    async function loadItems() {
      const { data, error } = await supabase.from('boodschappen_items').select('*');
      if (error) { console.error(error); return; }
      items = data || [];
      render();
    }

    async function loadVasteArtikelen() {
      const { data, error } = await supabase.from('boodschappen_vaste_artikelen').select('*');
      if (error) { console.error(error); return; }
      vasteArtikelen = data || [];
      renderVasteLijst();
    }

    // --- Vaste artikelen modal ---
    const vastModalOverlay = document.getElementById('vaste-modal-overlay');
    document.getElementById('open-vaste-artikelen').addEventListener('click', () => {
      vastModalOverlay.classList.add('open');
    });
    document.getElementById('close-vaste-modal').addEventListener('click', () => {
      vastModalOverlay.classList.remove('open');
    });
    document.getElementById('vast-add-btn').addEventListener('click', async () => {
      const naamEl = document.getElementById('vast-naam-input');
      const catEl = document.getElementById('vast-categorie-select');
      if (!naamEl.value.trim()) { alert('Naam is verplicht'); return; }
      const { error } = await supabase.from('boodschappen_vaste_artikelen').insert({
        naam: naamEl.value.trim(),
        categorie: catEl.value,
      });
      if (error) { alert('Kon niet toevoegen: ' + error.message); return; }
      naamEl.value = '';
    });

    function renderVasteLijst() {
      const el = document.getElementById('vaste-lijst');
      const sorted = [...vasteArtikelen].sort((a, b) => a.naam.localeCompare(b.naam, 'nl'));
      el.innerHTML = sorted.map(v => `
        <div class="vast-item-row" data-id="${v.id}">
          <span class="naam">${escapeHtml(v.naam)}</span>
          <span class="cat">${escapeHtml(v.categorie)}</span>
          <button class="vast-add-to-list-btn" data-action="add">+ Lijst</button>
          <button data-action="delete">🗑</button>
        </div>
      `).join('');
      el.querySelectorAll('[data-action="add"]').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const id = e.target.closest('.vast-item-row').getAttribute('data-id');
          const vastArtikel = vasteArtikelen.find(v => String(v.id) === String(id));
          if (!vastArtikel) return;
          const payload = GezinBoodschappen.buildInsertPayload({
            naam: vastArtikel.naam,
            categorie: vastArtikel.categorie,
            vastArtikel,
          });
          await insertItem(payload);
        });
      });
      el.querySelectorAll('[data-action="delete"]').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const id = e.target.closest('.vast-item-row').getAttribute('data-id');
          await supabase.from('boodschappen_vaste_artikelen').delete().eq('id', id);
        });
      });
    }

    // --- Kalender-tab ---
    let afspraken = [];
    let verjaardagen = [];
    const vandaag = new Date();
    let bekekenJaar = vandaag.getFullYear();
    let bekekenMaand = vandaag.getMonth(); // 0-indexed

    const maandLabelEl = document.getElementById('maand-label');
    const agendaLijstEl = document.getElementById('agenda-lijst');
    const afspraakTitelInput = document.getElementById('afspraak-titel-input');
    const afspraakDatumInput = document.getElementById('afspraak-datum-input');
    const afspraakTijdInput = document.getElementById('afspraak-tijd-input');
    const afspraakWieSelect = document.getElementById('afspraak-wie-select');

    function populateWieSelect() {
      afspraakWieSelect.innerHTML = GezinKalender.WIE_OPTIES.map(w => `<option value="${w}">${w}</option>`).join('');
    }
    populateWieSelect();
    afspraakDatumInput.value = GezinKalender.toIsoDate(vandaag);

    function populateMaandSelect() {
      const sel = document.getElementById('verjaardag-maand-select');
      sel.innerHTML = GezinKalender.MAAND_NAMEN.map((naam, i) => `<option value="${i + 1}">${naam}</option>`).join('');
    }
    populateMaandSelect();

    function wieClass(wie) {
      return 'wie-' + wie.replace(/\s+/g, '-');
    }

    function renderMaandLabel() {
      maandLabelEl.textContent = GezinKalender.monthLabel(bekekenJaar, bekekenMaand);
    }

    function renderAgenda() {
      renderMaandLabel();
      const dagen = GezinKalender.buildMonthAgenda(afspraken, verjaardagen, bekekenJaar, bekekenMaand, vandaag);
      if (dagen.length === 0) {
        agendaLijstEl.innerHTML = '<div class="empty-state">Geen afspraken deze maand 🎉</div>';
        return;
      }
      agendaLijstEl.innerHTML = dagen.map(dag => `
        <div class="agenda-dag-groep">
          <div class="agenda-dag-titel">${formatDagTitel(dag.datum)}</div>
          ${dag.items.map(item => `
            <div class="agenda-item ${item.type === 'verjaardag' ? 'verjaardag' : ''}">
              <span class="tijd">${item.tijd || (item.type === 'verjaardag' ? '🎂' : '')}</span>
              <span class="titel">${escapeHtml(item.titel)}</span>
              ${item.type === 'afspraak' ? `<span class="wie-badge ${wieClass(item.wie)}">${escapeHtml(item.wie)}</span>` : ''}
            </div>
          `).join('')}
        </div>
      `).join('');
    }

    function formatDagTitel(isoDatum) {
      const [y, m, d] = isoDatum.split('-').map(Number);
      const date = new Date(y, m - 1, d);
      const dagNamen = ['zondag', 'maandag', 'dinsdag', 'woensdag', 'donderdag', 'vrijdag', 'zaterdag'];
      return `${dagNamen[date.getDay()]} ${d} ${GezinKalender.MAAND_NAMEN[m - 1]}`;
    }

    document.getElementById('maand-vorige').addEventListener('click', () => {
      bekekenMaand--;
      if (bekekenMaand < 0) { bekekenMaand = 11; bekekenJaar--; }
      renderAgenda();
    });
    document.getElementById('maand-volgende').addEventListener('click', () => {
      bekekenMaand++;
      if (bekekenMaand > 11) { bekekenMaand = 0; bekekenJaar++; }
      renderAgenda();
    });

    document.getElementById('afspraak-add-btn').addEventListener('click', async () => {
      let payload;
      try {
        payload = GezinKalender.buildAfspraakInsertPayload({
          titel: afspraakTitelInput.value,
          datum: afspraakDatumInput.value,
          tijd: afspraakTijdInput.value,
          wie: afspraakWieSelect.value,
        });
      } catch (err) {
        alert(err.message);
        return;
      }
      const { error } = await supabase.from('kalender_afspraken').insert(payload);
      if (error) { alert('Kon niet toevoegen: ' + error.message); return; }
      afspraakTitelInput.value = '';
      afspraakTijdInput.value = '';
      afspraakDatumInput.value = GezinKalender.toIsoDate(vandaag);
    });

    // --- Verjaardag-modal ---
    const verjaardagModalOverlay = document.getElementById('verjaardag-modal-overlay');
    document.getElementById('open-verjaardag-modal').addEventListener('click', () => {
      verjaardagModalOverlay.classList.add('open');
    });
    document.getElementById('close-verjaardag-modal').addEventListener('click', () => {
      verjaardagModalOverlay.classList.remove('open');
    });
    document.getElementById('verjaardag-add-btn').addEventListener('click', async () => {
      let payload;
      try {
        payload = GezinKalender.buildVerjaardagInsertPayload({
          naam: document.getElementById('verjaardag-naam-input').value,
          dag: document.getElementById('verjaardag-dag-input').value,
          maand: document.getElementById('verjaardag-maand-select').value,
        });
      } catch (err) {
        alert(err.message);
        return;
      }
      const { error } = await supabase.from('kalender_verjaardagen').insert(payload);
      if (error) { alert('Kon niet toevoegen: ' + error.message); return; }
      document.getElementById('verjaardag-naam-input').value = '';
      document.getElementById('verjaardag-dag-input').value = '';
    });

    function renderVerjaardagenLijst() {
      const el = document.getElementById('verjaardagen-lijst');
      const sorted = [...verjaardagen].sort((a, b) => (a.maand - b.maand) || (a.dag - b.dag));
      el.innerHTML = sorted.map(v => `
        <div class="vast-item-row" data-id="${v.id}">
          <span class="naam">${escapeHtml(v.naam)}</span>
          <span class="cat">${v.dag} ${GezinKalender.MAAND_NAMEN[v.maand - 1]}</span>
          <button data-action="delete-verjaardag">🗑</button>
        </div>
      `).join('');
      el.querySelectorAll('[data-action="delete-verjaardag"]').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const id = e.target.closest('.vast-item-row').getAttribute('data-id');
          await supabase.from('kalender_verjaardagen').delete().eq('id', id);
        });
      });
    }

    async function loadAfspraken() {
      const { data, error } = await supabase.from('kalender_afspraken').select('*');
      if (error) { console.error(error); return; }
      afspraken = data || [];
      renderAgenda();
    }

    async function loadVerjaardagen() {
      const { data, error } = await supabase.from('kalender_verjaardagen').select('*');
      if (error) { console.error(error); return; }
      verjaardagen = data || [];
      renderVerjaardagenLijst();
      renderAgenda();
    }

    // --- Realtime ---
    function subscribeRealtime() {
      supabase.channel('boodschappen_items_changes')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'boodschappen_items' }, () => {
          loadItems();
        })
        .subscribe();
      supabase.channel('vaste_artikelen_changes')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'boodschappen_vaste_artikelen' }, () => {
          loadVasteArtikelen();
        })
        .subscribe();
      supabase.channel('kalender_afspraken_changes')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'kalender_afspraken' }, () => {
          loadAfspraken();
        })
        .subscribe();
      supabase.channel('kalender_verjaardagen_changes')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'kalender_verjaardagen' }, () => {
          loadVerjaardagen();
        })
        .subscribe();
    }

    // --- Init ---
    (async function init() {
      if (!supabase) { console.error('Supabase-client kon niet worden aangemaakt.'); return; }
      await loadVasteArtikelen();
      await cleanupExpiredItems();
      await loadItems();
      await loadAfspraken();
      await loadVerjaardagen();
      subscribeRealtime();
    })();
  })();
}
</script>
</body>
</html>
